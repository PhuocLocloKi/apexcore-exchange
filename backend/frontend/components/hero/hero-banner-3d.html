<!-- ========================================================
     APEXCORE COMPONENT: Hero Banner 3D Parallax
     Bò Tót Phố Wall NPL 3D + Floating Tilted Phone + Energy Disc
     ======================================================== -->
<section class="hero-section perspective-container" id="hero">
  <!-- Subtle Background Grid & Star Dust -->
  <div class="cyber-grid-overlay"></div>
  <div class="ambient-glow-top"></div>

  <div class="hero-container">
    <!-- Left Column: Copywriting & Stats -->
    <div class="hero-content">
      <div class="hero-badge">
        <span class="badge-dot"></span>
        <span>SÀN GIAO DỊCH TÀI SẢN SỐ & CHỨNG KHOÁN</span>
      </div>

      <h1 class="hero-headline">
        Giao dịch thông minh<br>
        <span class="gradient-neon-text">Kiến tạo tương lai</span>
      </h1>

      <p class="hero-description text-contrast-sub">
        APEXCORE mang đến nền tảng giao dịch hiện đại, ổn định và an toàn cho mọi nhà đầu tư.
      </p>

      <!-- 3 Key Impressive Stats -->
      <div class="hero-stats-row">
        <div class="stat-card">
          <div class="stat-number num-tabular">1.2M+</div>
          <div class="stat-label">Người dùng</div>
        </div>
        <div class="stat-card">
          <div class="stat-number num-tabular">$8.6B+</div>
          <div class="stat-label">Khối lượng giao dịch 24h</div>
        </div>
        <div class="stat-card">
          <div class="stat-number num-tabular">150+</div>
          <div class="stat-label">Tài sản giao dịch</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="hero-cta-group">
        <button class="btn-neon-glow" id="hero-btn-start">
          <span>Bắt đầu ngay</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <button class="btn-glass-subtle" id="hero-btn-learn">
          Tìm hiểu thêm
        </button>
      </div>
    </div>

    <!-- Right Column: 3D Cyber Bull & Floating Phone (Mouse Tilt Parallax) -->
    <div class="hero-visual-col perspective-container">
      <div class="hero-tilt-stage tilt-3d" id="hero-parallax-stage">
        
        <!-- Energy Disc & Orbit Rings Behind -->
        <div class="energy-disc-rig">
          <div class="disc-glow animate-glow-pulse"></div>
          <div class="disc-ring outer-ring animate-energy-disc"></div>
          <div class="disc-ring inner-ring animate-energy-disc-reverse"></div>
        </div>

        <!-- Cyber Bull Mascot Center Stage -->
        <div class="bull-mascot-wrapper animate-float">
          <img src="assets/images/hero-bull-mascot.png" alt="ApexCore Cyber Bull" class="bull-mascot-img" onerror="this.src='assets/bull_mascot.jpg'">
        </div>

        <!-- 3D Floating Phone Tilted 15-Degrees -->
        <div class="floating-phone-wrapper animate-phone-tilt">
          <div class="phone-glass-case">
            <img src="assets/images/mobile-mockup.png" alt="Mobile Trading App" class="phone-screen-img" onerror="this.src='assets/phone_mockup.jpg'">
            <!-- Screen Neon Reflection Glow -->
            <div class="phone-screen-glow"></div>
          </div>
        </div>

        <!-- Floating Holographic Candle Pillars -->
        <div class="holo-pillar pillar-1"></div>
        <div class="holo-pillar pillar-2"></div>
        <div class="holo-pillar pillar-3"></div>

        <!-- Bottom Platform Watermark -->
        <div class="mascot-watermark">Trade Beyond Limits</div>
      </div>
    </div>
  </div>
</section>
