<!-- ========================================================
     APEXCORE COMPONENT: Login Modal Popup
     Glassmorphism + Debounce Guard + Social 1-Tap
     ======================================================== -->
<div class="modal-backdrop" id="login-modal-overlay" style="display: none;">
  <div class="modal-card glass-card animate-modal-in" role="dialog" aria-modal="true">
    <!-- Close Button -->
    <button class="modal-close-btn" id="login-modal-close" aria-label="Đóng">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>

    <!-- Modal Header with Bull Logo -->
    <div class="modal-header text-center">
      <div class="modal-logo-wrapper">
        <img src="assets/images/logo-bull-npl.png" alt="ApexCore Logo" class="modal-logo" onerror="this.src='assets/bull_logo.jpg'">
      </div>
      <div class="modal-brand-badge">APEXCORE</div>
      <div class="modal-brand-tagline">Trade Beyond Limits</div>
      <h3 class="modal-title text-contrast-safe">Đăng nhập</h3>
      <p class="modal-subtitle text-contrast-sub">Chào mừng bạn trở lại!</p>
    </div>

    <!-- Login Form -->
    <form class="modal-form" id="form-login" onsubmit="return false;">
      <!-- Email / Phone Field -->
      <div class="form-group">
        <label for="login-identity" class="form-label">Email hoặc số điện thoại</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="text" id="login-identity" class="form-input" placeholder="Nhập email hoặc số điện thoại" required autocomplete="username">
        </div>
      </div>

      <!-- Password Field with Visibility Toggle -->
      <div class="form-group">
        <label for="login-password" class="form-label">Mật khẩu</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="login-password" class="form-input" placeholder="Nhập mật khẩu" required autocomplete="current-password">
          <button type="button" class="eye-toggle-btn" id="btn-toggle-login-pass" aria-label="Hiện/ẩn mật khẩu">
            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <!-- Remember & Forgot -->
      <div class="form-options-row">
        <label class="custom-checkbox-label">
          <input type="checkbox" id="login-remember" checked>
          <span class="checkbox-box"></span>
          <span class="checkbox-text">Ghi nhớ tài khoản</span>
        </label>
        <a href="#" class="forgot-link">Quên mật khẩu?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit-neon" id="btn-submit-login">
        <span class="btn-text">Đăng nhập ➔</span>
      </button>

      <!-- Social Divider -->
      <div class="divider-text">
        <span>Hoặc đăng nhập với</span>
      </div>

      <!-- Social 1-Tap Buttons -->
      <div class="social-login-grid">
        <button type="button" class="btn-social" id="btn-login-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.56 0 2.96.54 4.07 1.42l3.05-3.05C17.26 1.68 14.81 1 12 1 7.46 1 3.58 3.58 1.63 7.34l3.71 2.88C6.23 7.34 8.87 5 12 5z"/><path fill="#4285F4" d="M23.49 12.28c0-.79-.07-1.54-.19-2.28H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.72 2.88c2.18-2.01 3.7-4.99 3.7-8.69z"/><path fill="#FBBC05" d="M5.34 14.78c-.24-.72-.37-1.49-.37-2.28s.13-1.56.37-2.28L1.63 7.34C.59 9.42 0 11.66 0 14.22c0 2.56.59 4.8 1.63 6.88l3.71-2.32z"/><path fill="#34A853" d="M12 23.44c3.24 0 5.95-1.08 7.93-2.91l-3.72-2.88c-1.07.72-2.45 1.16-4.21 1.16-3.13 0-5.77-2.34-6.66-5.22L1.63 15.91C3.58 20.86 7.46 23.44 12 23.44z"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="btn-social" id="btn-login-apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.87-.9.04-1.99.6-2.63 1.35-.56.64-1.05 1.7-0.92 2.74 1.01.08 2.02-.48 2.62-1.22z"/></svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Switch to Register -->
      <div class="modal-switch-text">
        Chưa có tài khoản? <a href="#" id="switch-to-register">Đăng ký ngay</a>
      </div>
    </form>
  </div>
</div>
