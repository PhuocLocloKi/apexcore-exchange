<!-- ==========================================
     APEXCORE COMPONENT: Header & Navigation
     ========================================== -->
<header class="apex-header glass-panel sticky-header">
  <div class="header-container">
    <!-- Brand Logo -->
    <a href="#" class="brand-group">
      <div class="logo-wrapper">
        <img src="assets/images/logo-bull-npl.png" alt="ApexCore Logo" class="brand-logo" onerror="this.src='assets/bull_logo.jpg'">
      </div>
      <div class="brand-text">
        <span class="brand-title">APEXCORE</span>
        <span class="brand-badge">PRO</span>
      </div>
    </a>

    <!-- Navigation Menu -->
    <nav class="nav-links">
      <a href="#trading" class="nav-item active">Thị trường</a>
      <a href="#trading" class="nav-item">Giao dịch</a>
      <a href="#wallet" class="nav-item">Ví</a>
      <a href="#footer" class="nav-item">Về chúng tôi</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Search Trigger -->
      <button class="icon-btn" title="Tìm kiếm" id="btn-search-trigger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>

      <!-- Language Switcher -->
      <button class="lang-switcher" id="btn-lang-switch">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span>VI</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>

      <!-- Auth Action Buttons -->
      <button class="btn-ghost" id="header-btn-login">Đăng nhập</button>
      <button class="btn-neon" id="header-btn-register">Đăng ký</button>
    </div>
  </div>
</header>
