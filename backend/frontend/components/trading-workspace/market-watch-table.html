    <!-- Quick Deposit Bull Card -->
    <div class="sidebar-deposit-box glass-panel">
      <div class="deposit-mascot-glow">
        <img src="assets/images/logo-bull-npl.png" alt="Deposit Mascot" class="deposit-bull-icon" onerror="this.src='assets/bull_logo.jpg'">
      </div>
      <div class="deposit-box-title">Nạp ngay</div>
      <div class="deposit-box-subtitle">Tận dụng cơ hội đầu tư tốt nhất</div>
      <button class="btn-deposit-neon" id="sidebar-btn-deposit">Nạp tiền</button>
    </div>
  </aside>

  <!-- Market Watch Panel -->
  <section class="market-watch-panel glass-card">
    <div class="market-watch-header">
      <h3 class="panel-section-title">Thị trường</h3>
      
      <!-- 4 Category Filter Tabs -->
      <div class="market-category-tabs">
        <button class="cat-tab-btn active" data-cat="crypto">Crypto</button>
        <button class="cat-tab-btn" data-cat="stocks">Chứng khoán</button>
        <button class="cat-tab-btn" data-cat="forex">Forex</button>
        <button class="cat-tab-btn" data-cat="indices">Indices</button>
      </div>

      <!-- Search Input -->
      <div class="market-search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="market-search-input" placeholder="Tìm kiếm tài sản..." autocomplete="off">
      </div>
    </div>

    <!-- Market Table Header -->
    <div class="market-table-cols">
      <span class="col-name">Tên</span>
      <span class="col-price text-right">Giá</span>
      <span class="col-change text-right">24h</span>
    </div>

    <!-- Market List Container (Populated dynamically) -->
    <div class="market-list-container" id="market-watch-list">
      <!-- Item Template loaded from market-symbols.js -->
    </div>
  </section>
</div>
